# Continuous integration: every push and pull request must lint, typecheck,
# pass the tests and build - for BOTH halves of the monorepo - so a broken
# commit is caught whichever half it touches. Deployment lives in pages.yml
# and worker-api.yml; this workflow only verifies.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend (lint, typecheck, test, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Lint (Biome)
        run: npm run lint
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      - name: Build static export
        run: npm run build

  worker-api:
    name: Worker API (typecheck, test, bundle)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker-api
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: worker-api/package-lock.json
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      - name: Bundle (dry run, nothing is deployed)
        run: npx wrangler deploy --dry-run --outdir dist

  # Performance / accessibility / SEO budget. Fails the build if a page drops
  # below the thresholds in lighthouserc.json, so regressions are caught before
  # they reach the live site. Reports are kept as a workflow artifact (they are
  # NOT uploaded to any public service).
  lighthouse:
    name: Lighthouse CI
    needs: frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build static export
        run: npm run build
      - name: Run Lighthouse CI
        run: npx --yes @lhci/cli@0.16.1 autorun
      - name: Keep the reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: lighthouse-reports
          path: .lighthouseci
