# Deploys the Cloudflare Worker API (chat, messages, MCP) when worker-api/ changes on main.
# Required repository secrets: CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID.
# Runtime secrets (RESEND_API_KEY) are set once with `wrangler secret put` and live on Cloudflare,
# not in this repository.
name: Deploy Worker API

on:
  push:
    branches: [main]
    paths:
      - "worker-api/**"
      - ".github/workflows/worker-api.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: worker-api-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker-api
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: worker-api/package-lock.json
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      - name: Apply D1 migrations
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: worker-api
          command: d1 migrations apply dinesh-portfolio-leads --remote
      - name: Deploy to Cloudflare Workers
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: worker-api
          command: deploy
